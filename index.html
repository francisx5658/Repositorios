<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francisco Veliz - Proyectos</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="noelizz.svg">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- Header / Navbar -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 dark:border-slate-800/80 glass">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i data-lucide="folder-git-2" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 dark:text-white leading-tight">LinkHub</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Mis Proyectos & Enlaces</p>
        </div>
      </div>

      <!-- Botón Modo Oscuro / Claro -->
      <button id="theme-toggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors">
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-amber-400"></i>
        <i data-lucide="moon" class="w-5 h-5 block dark:hidden text-slate-600"></i>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-grow">
    
    <!-- Tarjeta de Perfil -->
    <div class="glass rounded-2xl p-6 mb-8 border border-slate-200/80 dark:border-slate-800/80 shadow-sm relative overflow-hidden">
      <div class="absolute -top-12 -right-12 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="flex flex-col md:flex-row items-center gap-6 relative z-10">
        <div class="relative">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvoYn3wJkmDWmgPzSe856QDz9gYKr4vXH7hDNvZXKxQoxf1F5Ye6OLoAc&s=10" alt="Francisco Veliz" class="w-24 h-24 md:w-28 md:h-28 rounded-2xl object-cover ring-4 ring-indigo-500/20 shadow-md">
          <div class="absolute -bottom-2 -right-2 bg-indigo-600 text-white p-1.5 rounded-lg shadow">
            <i data-lucide="code-2" class="w-4 h-4"></i>
          </div>
        </div>

        <div class="text-center md:text-left flex-grow">
          <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Francisco Veliz</h2>
          <p class="text-indigo-600 dark:text-indigo-400 font-medium text-sm mb-2">@Veliz_14_</p>
          <p class="text-slate-600 dark:text-slate-300 text-sm max-w-xl mb-4">
            Desarrollador Full Stack & Diseñador. Mi colección organizada de enlaces y proyectos.
          </p>

          <!-- Estadísticas -->
          <div class="flex flex-wrap justify-center md:justify-start gap-3">
            <div class="bg-amber-500/10 border border-amber-500/20 text-amber-600 dark:text-amber-400 text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5">
              <i data-lucide="folder" class="w-3.5 h-3.5"></i>
              <span id="stat-folders">1 Carpeta</span>
            </div>
            <div class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-600 dark:text-indigo-400 text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5">
              <i data-lucide="link" class="w-3.5 h-3.5"></i>
              <span id="stat-links">9 Links</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Navegación & Buscador -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
      <!-- Breadcrumb / Migas de pan -->
      <nav id="breadcrumb" class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400 overflow-x-auto w-full sm:w-auto py-1">
        <!-- Generado dinámicamente -->
      </nav>

      <!-- Buscador -->
      <div class="relative w-full sm:w-72">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="search-input" placeholder="Buscar por nombre o URL..." class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
      </div>
    </div>

    <!-- Contenedor Principal de Carpetas y Links -->
    <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Contenido renderizado mediante JS -->
    </div>

  </main>

  <!-- Footer con tu logo -->
  <footer class="w-full py-6 border-t border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400">
    <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img src="noelizz.svg" alt="Noelizz Logo" class="h-8 w-auto object-contain">
        <span class="font-semibold text-slate-700 dark:text-slate-300">Noelizz</span>
      </div>
      <p class="text-sm text-center">
        © <span id="current-year"></span> Noelizz. Todos los proyectos protegidos.
      </p>
    </div>
  </footer>

  <!-- Lógica JavaScript -->
  <script>
    // Configuración de datos predeterminados (Todos tus enlaces reales)
    const foldersData = [
      { id: "f_condicionales", name: "Condicionales", icon: "📁", parentId: null }
    ];

    const linksData = [
      { id: "l1", folderId: "f_condicionales", title: "Temperatura 1", url: "https://francisx5658.github.io/Temperatura_1/", icon: "github", description: "Proyecto de temperatura en JS" },
      { id: "l2", folderId: "f_condicionales", title: "sumas 2", url: "https://francisx5658.github.io/Sumas_2/", icon: "github", description: "Operaciones de suma" },
      { id: "l3", folderId: "f_condicionales", title: "numeros altos y bajos 3", url: "https://francisx5658.github.io/numeros-altos-y-bajos_3/", icon: "github", description: "Comparador de números" },
      { id: "l4", folderId: "f_condicionales", title: "Tamaño de pantalla 4", url: "https://francisx5658.github.io/Tama-os-de-pantalla_4/", icon: "github", description: "Detección de dimensiones" },
      { id: "l5", folderId: "f_condicionales", title: "comparacion 5", url: "https://francisx5658.github.io/comparacion-de-tama-o-de-pantalla_5.2/", icon: "github", description: "Comparación condicional" },
      { id: "l6", folderId: "f_condicionales", title: "Calculadora IMC", url: "https://francisx5658.github.io/Calculadora-IMC/", icon: "github", description: "Cálculo de índice de masa corporal" },
      { id: "l7", folderId: "f_condicionales", title: "verificar email y contraseña", url: "https://francisx5658.github.io/verificar-email-y-contra_7/", icon: "github", description: "Validación de credenciales" },
      { id: "l8", folderId: "f_condicionales", title: "Selector de opciones 8", url: "https://francisx5658.github.io/Selector-de-opciones_8/", icon: "github", description: "Menú de selección de opciones" },
      { id: "l9", folderId: "f_condicionales", title: "Cuotas 9", url: "https://francisx5658.github.io/Cuotas_9/", icon: "github", description: "Cálculo de cuotas financieras" }
    ];

    let currentFolderId = null;
    let searchQuery = "";

    // Elementos del DOM
    const gridContainer = document.getElementById('grid-container');
    const breadcrumb = document.getElementById('breadcrumb');
    const searchInput = document.getElementById('search-input');
    const themeToggleBtn = document.getElementById('theme-toggle');

    // Inicializar la aplicación
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-year').textContent = new Date().getFullYear();
      render();
      lucide.createIcons();
    });

    // Cambiar tema
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Búsqueda
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    // Renderizar navegación (Breadcrumbs)
    function renderBreadcrumbs() {
      breadcrumb.innerHTML = '';
      
      const homeBtn = document.createElement('button');
      homeBtn.className = `flex items-center gap-1 font-medium transition-colors ${currentFolderId === null ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'hover:text-indigo-500'}`;
      homeBtn.innerHTML = `<i data-lucide="home" class="w-4 h-4"></i> Inicio`;
      homeBtn.onclick = () => { currentFolderId = null; render(); };
      breadcrumb.appendChild(homeBtn);

      if (currentFolderId) {
        const currentFolder = foldersData.find(f => f.id === currentFolderId);
        if (currentFolder) {
          const separator = document.createElement('span');
          separator.innerText = '/';
          breadcrumb.appendChild(separator);

          const folderBtn = document.createElement('span');
          folderBtn.className = 'text-indigo-600 dark:text-indigo-400 font-bold flex items-center gap-1';
          folderBtn.innerHTML = `<i data-lucide="folder" class="w-4 h-4"></i> ${currentFolder.name}`;
          breadcrumb.appendChild(folderBtn);
        }
      }
      lucide.createIcons();
    }

    // Renderizar vista general
    function render() {
      renderBreadcrumbs();
      gridContainer.innerHTML = '';

      let filteredFolders = foldersData.filter(f => f.parentId === currentFolderId);
      let filteredLinks = linksData.filter(l => l.folderId === currentFolderId);

      // Filtrar por búsqueda si existe
      if (searchQuery) {
        filteredFolders = foldersData.filter(f => f.name.toLowerCase().includes(searchQuery));
        filteredLinks = linksData.filter(l => l.title.toLowerCase().includes(searchQuery) || l.url.toLowerCase().includes(searchQuery));
      }

      if (filteredFolders.length === 0 && filteredLinks.length === 0) {
        gridContainer.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400">
            <i data-lucide="folder-open" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
            <p class="font-medium text-lg">Esta carpeta está vacía</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // Renderizar Carpetas
      filteredFolders.forEach(folder => {
        const count = linksData.filter(l => l.folderId === folder.id).length;
        const card = document.createElement('div');
        card.className = "glass p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 hover:border-indigo-500/50 hover:shadow-lg transition-all cursor-pointer flex items-center justify-between group";
        card.onclick = () => { currentFolderId = folder.id; searchQuery = ""; searchInput.value = ""; render(); };
        
        card.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
              <i data-lucide="folder" class="w-6 h-6"></i>
            </div>
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white group-hover:text-indigo-500 transition-colors">${folder.name}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">${count} proyectos</p>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400 group-hover:translate-x-1 transition-transform"></i>
        `;
        gridContainer.appendChild(card);
      });

      // Renderizar Enlaces
      filteredLinks.forEach(link => {
        const card = document.createElement('div');
        card.className = "glass p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 hover:border-indigo-500/50 hover:shadow-lg transition-all flex flex-col justify-between group";
        
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-indigo-500 flex items-center justify-center">
                <i data-lucide="github" class="w-5 h-5"></i>
              </div>
              <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1 transition-colors">
                Abrir <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>
            </div>
            <h3 class="font-bold text-slate-900 dark:text-white mb-1 group-hover:text-indigo-500 transition-colors">${link.title}</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-3 line-clamp-2">${link.description || 'Proyecto de GitHub Pages'}</p>
          </div>
          <div class="pt-2 border-t border-slate-200/50 dark:border-slate-800/50 flex items-center justify-between text-[11px] text-slate-400">
            <span class="truncate max-w-[200px]">${link.url.replace('https://', '')}</span>
          </div>
        `;
        gridContainer.appendChild(card);
      });

      lucide.createIcons();
    }
  </script>
</body>
</html>
